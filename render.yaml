databases:
    - name: hos-routing-db
      plan: free

services:
    - type: web
      name: hos-routing-platform
      runtime: python
      plan: free
      buildCommand: "bash ./build.sh"
      startCommand: "gunicorn --chdir backend --bind 0.0.0.0:$PORT core.wsgi:application"
      envVars:
          - key: DATABASE_URL
            fromDatabase:
                name: hos-routing-db
                property: connectionString
          - key: DJANGO_DEBUG
            value: "false"
          - key: DJANGO_SECRET_KEY
            generateValue: true
          - key: PYTHON_VERSION
            value: "3.13.5"
          - key: WEB_CONCURRENCY
            value: "2"
